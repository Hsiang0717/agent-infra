[package]
name = "statusline"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.59", features = [
    "Win32_System_Power",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
