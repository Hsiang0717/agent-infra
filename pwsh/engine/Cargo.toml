[package]
name = "smart-hub"
version = "0.1.0"
edition = "2021"
description = "Context-Aware Smart Command & History Hub for PowerShell"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nucleo-matcher = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5.0"
dunce = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
