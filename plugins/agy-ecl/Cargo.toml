[package]
name = "agy-ecl"
version = "0.2.0"
description = "External Cognitive Layer (ECL) Auto-Shield PreInvocation Hook"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
