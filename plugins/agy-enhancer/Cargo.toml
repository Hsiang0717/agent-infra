[package]
name = "agy-enhancer"
version = "0.2.0"
description = "Agent-Native Runtime Enhancer Core: Context Posture Governance, Epistemic Memory Radar & PreToolUse Self-Healing"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
